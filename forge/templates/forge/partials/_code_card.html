<div class="client-card forge-client-card">
    <div class="client-checkbox">
        <input type="checkbox" class="client-select" data-code-id="{{ code.id }}">
    </div>
    <div class="client-logo-container">
        {% if code.thumbnail %}
            <img src="{{ code.thumbnail.url }}" alt="{{ code.name }}" class="client-logo">
        {% elif code.is_previewable %}
            <iframe class="card-preview-frame"
                    sandbox="allow-scripts" loading="lazy"></iframe>
            <script>
            (function(){
                var d = JSON.parse('{{ code.content_json_str|escapejs }}');
                var f = document.currentScript.previousElementSibling;
                if (!f) return;
                f.srcdoc = '<!DOCTYPE html><html><head><meta charset="utf-8"><style>'
                    + '*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}'
                    + 'html,body{width:100%;height:100%;overflow:hidden;background:#0f1117}'
                    + (d.css || '')
                    + '</style></head><body>'
                    + (d.html || '')
                    + '</body></html>';
            })();
            </script>
        {% else %}
            <div class="client-logo-placeholder">
                <span>{{ code.name|slice:":1"|upper }}</span>
            </div>
        {% endif %}
    </div>

    <div class="client-content">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
            <h3 class="client-name">{{ code.name }}</h3>
            <button type="button"
                    class="btn-client-favorite {% if code.is_favorite %}active{% endif %}"
                    data-toggle-url="{% url 'forge:toggle_favorite' code.slug %}"
                    title="{% if code.is_favorite %}Desfavoritar{% else %}Favoritar{% endif %}">
                <i class="fa-{% if code.is_favorite %}solid{% else %}regular{% endif %} fa-star"></i>
            </button>
        </div>
        {% if code.description %}
            <p class="client-description">{{ code.description }}</p>
        {% endif %}
    </div>

    <div class="client-footer">
        <div class="client-status">
            <span class="badge badge-gold">{{ code.category|default:code.get_type_display|truncatechars:14 }}</span>
        </div>
        <div class="client-actions">
            <a href="{% url 'forge:detalhes' code.slug %}" class="action-link" title="Ver"><i class="fa-solid fa-eye"></i></a>
            <a href="{% url 'forge:editar_codigo' code.slug %}" class="action-link" title="Editar"><i class="fa-solid fa-pencil"></i></a>
            <a href="{% url 'forge:exportar' code.slug %}" class="action-link" title="Exportar"><i class="fa-solid fa-download"></i></a>
        </div>
    </div>
</div>
